<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Open</div>
                        <div class="stat-value" id="stat-open">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Resolved</div>
                        <div class="stat-value text-success" id="stat-resolved">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Overdue</div>
                        <div class="stat-value text-danger" id="stat-overdue">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Critical</div>
                        <div class="stat-value text-danger" id="stat-critical">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Avg Resolution</div>
                        <div class="stat-value" id="stat-avg">0h</div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
                    <div class="card">
                        <h3 class="card-title" style="margin-bottom:1rem;">By Status</h3>
                        <div id="chart-status"></div>
                    </div>
                    <div class="card">
                        <h3 class="card-title" style="margin-bottom:1rem;">By Priority</h3>
                        <div id="chart-priority"></div>
                    </div>
                    <div class="card">
                        <h3 class="card-title" style="margin-bottom:1rem;">By Category</h3>
                        <div id="chart-category"></div>
                    </div>
                    <div class="card">
                        <h3 class="card-title" style="margin-bottom:1rem;">By Building</h3>
                        <div id="chart-building"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/issues.js"></script>
    <script src="../js/analytics.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>AdminModule.initAnalytics();</script>
</body>

</html>
