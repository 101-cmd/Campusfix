<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix - Manage Issues</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">All Issues</h3>
                        <input type="text" class="form-control" id="search" placeholder="Search issues..." style="width: 250px;">
                    </div>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                        <select class="form-control" id="f-status" style="width:auto"><option value="">All Status</option><option>SUBMITTED</option><option>VERIFIED</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select>
                        <select class="form-control" id="f-priority" style="width:auto"><option value="">All Priority</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select>
                        <select class="form-control" id="f-category" style="width:auto"><option value="">All Categories</option></select>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>Ref</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>SLA</th><th>Action</th></tr></thead>
                            <tbody id="issues-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        App.init('ADMIN');
        Storage.getCategories().forEach(c => document.getElementById('f-category').innerHTML += `<option>${c}</option>`);

        function render() {
            const search = document.getElementById('search').value.toLowerCase();
            const fStatus = document.getElementById('f-status').value;
            const fPriority = document.getElementById('f-priority').value;
            const fCategory = document.getElementById('f-category').value;

            const issues = Storage.getIssues().filter(i => {
                if (search && !i.title.toLowerCase().includes(search) && !i.ref.toLowerCase().includes(search)) return false;
                if (fStatus && i.status !== fStatus) return false;
                if (fPriority && i.priority !== fPriority) return false;
                if (fCategory && i.category !== fCategory) return false;
                return true;
            });

            document.getElementById('issues-body').innerHTML = issues.map(i => `
                <tr>
                    <td>${i.ref}</td>
                    <td>${i.title}</td>
                    <td>${i.category}</td>
                    <td><span class="badge badge-${i.priority.toLowerCase()}">${i.priority}</span></td>
                    <td><span class="badge badge-${i.status.toLowerCase().replace('_','')}">${i.status}</span></td>
                    <td><span class="badge badge-${Utils.getSLAStatus(i).toLowerCase().replace(' ','')}">${Utils.getSLAStatus(i)}</span></td>
                    <td><a href="issue-details.html?id=${i.id}" class="btn btn-sm btn-primary">Manage</a></td>
                </tr>
            `).join('') || '<tr><td colspan="7" class="empty-state">No issues found.</td></tr>';
        }

        ['search', 'f-status', 'f-priority', 'f-category'].forEach(id => document.getElementById(id).oninput = render);
        render();
    </script>
</body>
</html>
