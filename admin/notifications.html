<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Admin Notifications</h3>
                        <button class="btn btn-outline btn-sm" id="btn-mark-all">Mark All as Read</button>
                    </div>
                    <div id="notif-list"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = Auth.requireRole('ADMIN');
        App.init('ADMIN');
        Notifications.renderBell(user.id);
        Notifications.renderList(user.id, 'notif-list');

        document.getElementById('btn-mark-all').onclick = () => {
            Notifications.markAllRead(user.id);
            Notifications.renderBell(user.id);
            Notifications.renderList(user.id, 'notif-list');
            Utils.toast('All marked as read.', 'success');
        };
    </script>
</body>

</html>
