<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Settings - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="card" style="max-width:500px;">
                    <h3 class="card-title" style="margin-bottom:1.5rem;">SLA Duration Settings (Hours)</h3>
                    <form id="sla-form">
                        <div class="form-group"><label class="form-label">LOW Priority</label><input type="number"
                                class="form-control" id="sla-low" min="1"></div>
                        <div class="form-group"><label class="form-label">MEDIUM Priority</label><input type="number"
                                class="form-control" id="sla-medium" min="1"></div>
                        <div class="form-group"><label class="form-label">HIGH Priority</label><input type="number"
                                class="form-control" id="sla-high" min="1"></div>
                        <div class="form-group"><label class="form-label">CRITICAL Priority</label><input type="number"
                                class="form-control" id="sla-critical" min="1"></div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>AdminModule.initSLA();</script>
</body>

</html>
