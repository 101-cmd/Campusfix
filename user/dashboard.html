<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Reported</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Open Issues</div>
                        <div class="stat-value" id="stat-open">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Resolved & Closed</div>
                        <div class="stat-value text-success" id="stat-resolved">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Needs Verification</div>
                        <div class="stat-value text-danger" id="stat-verify">0</div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Recent Issues</h3><a href="issues.html"
                                class="btn btn-sm btn-outline">View All</a>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Ref</th>
                                        <th>Title</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-issues-body"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Announcements</h3>
                        </div>
                        <div id="announcements"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/issues.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/user.js"></script>
    <script>UserModule.initDashboard();</script>
</body>

</html>
