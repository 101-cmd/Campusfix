<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix - Report Issue</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="card" style="max-width: 800px;">
                    <h2 class="card-title" style="margin-bottom: 1.5rem;">Report a Maintenance Issue</h2>
                    <form id="report-form">
                        <div class="form-group"><label class="form-label">Issue Title</label><input type="text"
                                class="form-control" id="title" required></div>
                        <div class="form-group"><label class="form-label">Description</label><textarea
                                class="form-control" id="description" required></textarea></div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group"><label class="form-label">Category</label><select
                                    class="form-control" id="category" required></select></div>
                            <div class="form-group"><label class="form-label">Priority Suggestion</label><select
                                    class="form-control" id="priority">
                                    <option>LOW</option>
                                    <option>MEDIUM</option>
                                    <option>HIGH</option>
                                    <option>CRITICAL</option>
                                </select></div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group"><label class="form-label">Building</label><input type="text"
                                    class="form-control" id="building" required></div>
                            <div class="form-group"><label class="form-label">Room/Area</label><input type="text"
                                    class="form-control" id="room" required></div>
                        </div>
                        <div class="form-group"><label class="form-label">Photo/Video (Simulated)</label><input
                                type="file" class="form-control" id="attachment"></div>
                        <button type="submit" class="btn btn-primary">Submit Issue</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/issues.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/user.js"></script>
    <script>UserModule.initReport();</script>
</body>

</html>
