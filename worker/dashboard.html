<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label"><span class="material-symbols-outlined" aria-hidden="true">assignment_ind</span>Active Assigned</div>
                        <div class="stat-value" id="stat-assigned">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label"><span class="material-symbols-outlined" aria-hidden="true">pending</span>In Progress</div>
                        <div class="stat-value" id="stat-progress">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label"><span class="material-symbols-outlined" aria-hidden="true">task_alt</span>Resolved (Pending)</div>
                        <div class="stat-value text-success" id="stat-resolved">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label"><span class="material-symbols-outlined" aria-hidden="true">schedule</span>Overdue</div>
                        <div class="stat-value text-danger" id="stat-overdue">0</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><span class="material-symbols-outlined" aria-hidden="true">build</span>Recent Assignments</h3><a href="issues.html"
                            class="btn btn-sm btn-outline"><span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>View All</a>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ref</th>
                                    <th>Title</th>
                                    <th>Location</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/issues.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/worker.js"></script>
    <script>WorkerModule.initDashboard();</script>
</body>

</html>
